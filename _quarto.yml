project:
  type: website
  output-dir: _site
  resources:
    - libs/

website:
  title: "Física — CIABA"
  navbar:
    left:
      - href: index.qmd
        text: Syllabus
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Syllabus
      - section: "UE 1 — Oscilações"
        contents: unidades/unidade-1-oscilacoes/*.qmd
      - section: "UE 2 — Ondas"
        contents: unidades/unidade-2-ondas/*.qmd
      # UE 3 — ordem de leitura = sequência do Moysés (cap. 1 e 2), não a numérica
      # da Parte B. Os nomes de arquivo continuam amarrados ao tópico do sumário;
      # só a ordem muda. Concordância completa: _docs/roteiro-moyses-ue3.md
      - section: "UE 3 — Mecânica dos Fluidos"
        contents:
          - unidades/unidade-3-fluidos/3-01-propriedades-dos-fluidos.qmd
          - unidades/unidade-3-fluidos/3-02-fluidos-em-repouso-pascal-arquimedes.qmd
          - unidades/unidade-3-fluidos/3-03-fluidos-em-movimento-continuidade-bernoulli.qmd
          - unidades/unidade-3-fluidos/3-08-kutta-joukowski.qmd
          - unidades/unidade-3-fluidos/3-07-sustentacao.qmd
          - unidades/unidade-3-fluidos/3-04-escoamento-reynolds-navier-stokes-camada-limite.qmd
          - unidades/unidade-3-fluidos/3-06-arrasto.qmd
          - unidades/unidade-3-fluidos/3-05-analise-dimensional-buckingham.qmd
      - section: "UE 4 — Termodinâmica"
        contents: unidades/unidade-4-termodinamica/*.qmd

format:
  html:
    theme: [brand, theme.scss]
    toc: true
    toc-title: "Nesta página"
    number-sections: false
    lang: pt-BR
    html-math-method: mathjax

execute:
  echo: true
  warning: false
