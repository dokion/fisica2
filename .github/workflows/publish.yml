# .github/workflows/publish.yml
# Renderiza o Quarto NA NUVEM e publica no GitHub Pages a cada push.
# Você nunca renderiza local: edita .qmd → commit → o site atualiza.
# Pré-requisito (uma vez): Settings → Pages → Source = "GitHub Actions".

name: Quarto Publish

on:
  push:
    branches: [main]
  workflow_dispatch:          # botão "Run workflow" pra rodar na mão

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true          # LaTeX para a apostila em PDF

      # ── Notas executam blocos {python} (matplotlib p/ paridade PDF) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install jupyter matplotlib numpy

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      # ── Apostila em PDF: um só arquivo do curso inteiro (CLAUDE.md §5) ──
      # Perfil separado, porque o projeto do site é website e um website gera um
      # PDF por página; o perfil troca o tipo para book, que encaderna tudo.
      - name: Render apostila (PDF)
        run: quarto render --profile apostila --to pdf

      - name: Copiar apostila para o site
        run: cp _apostila/FIS-02-apostila.pdf _site/FIS-02-apostila.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site            # output-dir padrão do projeto website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
